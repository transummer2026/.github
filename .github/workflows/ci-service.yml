name: CI Service (Réutilisable)

# CI3 — validation complète sur PR vers dev : titre PR, commitlint,
# secret scan, audit deps, lint, SAST, build de validation du Dockerfile
# (sans push : personne ne consomme les images de services à ce jour),
# notifications Discord, merge-gate. Sur push dev, tous les jobs sont skippés —
# la validation a déjà tourné sur la PR. Le chemin "ship" (build+push
# final, release, submodules) est dans ci-services-push.yml, à câbler le
# jour où le déploiement tirera les images depuis GHCR.
#
# Tests et coverage ont été retirés : non bloquants par choix d'équipe et
# seuil de couverture à 0 partout, ils ne gardaient rien — 3 services sur
# 5 n'ont aucun test, et le couple cargo test + tarpaulin coûtait 4 min
# par run du gateway pour mesurer 0 %. À recâbler le jour où une suite
# de tests doit réellement bloquer une PR.
#
# Tailscale et la trace OTel ont été retirés : ni l'un ni l'autre n'a
# jamais fonctionné. Le pin tailscale 1.98.1 n'existe pas dans le canal
# stable (404 sur pkgs.tailscale.com, curl exit 22), donc aucun tailnet
# n'était monté, donc le curl OTel expirait systématiquement (exit 28)
# en brûlant les 30 s de --max-time à chaque run. Les deux étapes étaient
# en continue-on-error, l'échec restait invisible. À remonter sur une
# base saine si la télémétrie CI redevient un besoin.

on:
  workflow_call:
    inputs:
      service_name:
        description: "Nom du service (ex: gateway, api, front)"
        required: true
        type: string
      lint_cmd:
        description: "Commande de lint"
        required: true
        type: string
      install_cmd:
        description: "Commande d'installation des deps (vide pour rust)"
        required: false
        type: string
        default: ""
      audit_cmd:
        description: "Commande dependency audit"
        required: false
        type: string
        default: ""

      # Inputs conservés mais non consommés. GitHub rejette un appel qui
      # passe un input non déclaré ("If a caller workflow passes an input
      # that is not specified in the called workflow, this results in an
      # error"), et les 5 ci.yml des services les passent encore : les
      # retirer ici casserait leur CI au merge, ci-service.yml étant
      # référencé via @main. Ils partiront quand les callers cesseront
      # de les envoyer.
      test_cmd:
        description: "Non utilisé — conservé pour compatibilité des callers"
        required: false
        type: string
        default: ""
      build_cmd:
        description: "Non utilisé — le job build fait un docker build"
        required: false
        type: string
        default: ""
      coverage_cmd:
        description: "Non utilisé — conservé pour compatibilité des callers"
        required: false
        type: string
        default: ""
      coverage_format:
        description: "Non utilisé — conservé pour compatibilité des callers"
        required: false
        type: string
        default: ""
      coverage_threshold:
        description: "Non utilisé — conservé pour compatibilité des callers"
        required: false
        type: number
        default: 0
      skip_build:
        description: "Passer le job build/push GHCR (ex: repo sans Dockerfile)"
        required: false
        type: boolean
        default: false
      docker_build_args:
        description: "Build args pour le docker build (une paire NOM=valeur par ligne)"
        required: false
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK_REPO:
        required: true
      GHCR_TOKEN:
        required: true
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      SEMANTIC_TOKEN:
        required: true

      # Secrets conservés mais non consommés, même règle que les inputs
      # ci-dessus : "If a caller workflow passes a secret that is not
      # specified in the called workflow, this results in an error".
      # Les 6 callers les passent encore.
      OTEL_ENDPOINT:
        required: false
      TAILSCALE_AUTHKEY:
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: Commit lint · Secret scan · Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      audit_severity: ${{ steps.audit.outputs.severity }}
    steps:
      - name: Générer le token App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get CI scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          token: ${{ steps.app.outputs.token }}
          path: .ci

      - name: Normaliser la PR (assignee + titre depuis le nom de branche)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .ci/.github/scripts/normalize_pr.sh

      - name: Commit lint
        id: commitlint
        continue-on-error: true
        uses: wagoid/commitlint-github-action@v6
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Secret scanning
        id: secret_scan
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Install cargo-audit
        if: contains(inputs.audit_cmd, 'cargo audit') && hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Skippé si le repo n'a pas encore de manifeste de deps à auditer.
      - name: Dependency audit
        id: audit
        if: hashFiles('Cargo.toml', 'package.json', 'pyproject.toml', 'requirements.txt') != ''
        env:
          AUDIT_CMD: ${{ inputs.audit_cmd }}
        run: bash .ci/.github/scripts/audit_severity.sh

      # Choix d'équipe : les CVE ne bloquent jamais en dev, on notifie seulement.
      - name: Notify Discord - CVE critique
        if: steps.audit.outputs.severity == 'critical'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_REPO }}
          status: failure
          title: "CVE critique - ${{ inputs.service_name }}"
          description: "@${{ github.actor }} CVE critique détectée (non bloquant en dev)."
          color: 0xFF0000

      - name: Notify Discord - CVE haute (warning fort)
        if: steps.audit.outputs.severity == 'high'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_REPO }}
          title: "⚠️ CVE haute - ${{ inputs.service_name }}"
          description: "@${{ github.actor }} CVE high détectée. À monitorer (non bloquant)."
          color: 0xFF4500

      - name: Notify Discord - CVE mineure
        if: steps.audit.outputs.severity == 'low'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_REPO }}
          status: warning
          title: "CVE mineure - ${{ inputs.service_name }}"
          description: "CVE medium/low détectée (info). Aucun blocage."
          color: 0xFFA500

      - name: Bilan des checks
        env:
          OUTCOMES: |
            commitlint=${{ steps.commitlint.outcome }}
            secret-scan=${{ steps.secret_scan.outcome }}
        run: bash .ci/.github/scripts/check_step_outcomes.sh

  # job 2 - QUALITY
  quality:
    name: Lint · SAST
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'push'
    timeout-minutes: 25
    steps:
      - name: Générer le token App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ steps.app.outputs.token }}

      - name: Get CI scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          token: ${{ steps.app.outputs.token }}
          path: .ci

      - name: Language detector
        id: lang
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        run: bash .ci/.github/scripts/detect_language.sh

      # cache: '' désactive le cache quand le repo n'a pas encore de lockfile
      # ou de fichier de deps (setup-* échoue sinon sur un repo squelette).
      - name: Setup Node
        if: ${{ steps.lang.outputs.language == 'node' }}
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}
      - name: Setup Python
        if: ${{ steps.lang.outputs.language == 'python' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: ${{ hashFiles('**/requirements.txt', '**/pyproject.toml') != '' && 'pip' || '' }}
      - name: Setup Rust
        if: ${{ steps.lang.outputs.language == 'rust' && steps.lang.outputs.has_project == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust
        if: ${{ steps.lang.outputs.language == 'rust' && steps.lang.outputs.has_project == 'true' }}
        uses: Swatinem/rust-cache@v2
      - name: Install deps
        if: inputs.install_cmd != '' && steps.lang.outputs.has_project == 'true'
        run: ${{ inputs.install_cmd }}
      
      - name: Prisma generator
        if: ${{ steps.lang.outputs.language == 'node' && inputs.service_name == 'backend' && steps.lang.outputs.has_project == 'true' }}
        run: npx prisma generate

      # Repo squelette (has_project=false) : lint/tests/coverage skippés,
      # ils échoueraient sur un repo sans code.
      - name: Lint
        id: lint
        if: steps.lang.outputs.has_project == 'true'
        continue-on-error: true
        run: ${{ inputs.lint_cmd }}

      - name: Lint Dockerfile (hadolint)
        id: hadolint
        if: hashFiles('Dockerfile') != ''
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Cache Semgrep
        id: semgrep_cache
        uses: actions/cache@v4
        with:
          path: ~/.semgrep-venv
          key: semgrep-${{ runner.os }}-v1

      - name: Install Semgrep
        if: steps.semgrep_cache.outputs.cache-hit != 'true'
        run: python3 -m venv ~/.semgrep-venv && ~/.semgrep-venv/bin/pip install semgrep

      - name: SAST - Semgrep
        id: semgrep
        continue-on-error: true
        run: ~/.semgrep-venv/bin/semgrep scan --config auto --error

      - name: Bilan des linters
        env:
          OUTCOMES: |
            lint=${{ steps.lint.outcome }}
            hadolint=${{ steps.hadolint.outcome }}
            semgrep=${{ steps.semgrep.outcome }}
        run: bash .ci/.github/scripts/check_step_outcomes.sh

  # job 3 - BUILD
  build:
    name: Build Dockerfile
    runs-on: ubuntu-latest
    needs: [checks, quality]
    if: >-
      ${{ !cancelled() && !inputs.skip_build && github.event_name != 'push' &&
          contains(fromJSON('["success", "skipped"]'), needs.checks.result) &&
          contains(fromJSON('["success", "skipped"]'), needs.quality.result) }}
    timeout-minutes: 25
    steps:
      - name: Générer le token App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ steps.app.outputs.token }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sans push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ inputs.service_name }}:ci
          build-args: ${{ inputs.docker_build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    needs: [checks, quality, build]
    if: ${{ always() && github.event_name != 'push' }}
    timeout-minutes: 10
    steps:
      - name: Générer le token App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get CI scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          token: ${{ steps.app.outputs.token }}
          path: .ci

      - name: Déterminer statut global
        id: status
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SKIP_BUILD: ${{ inputs.skip_build }}
        run: bash .ci/.github/scripts/global_status.sh

      - name: Notify Discord - succès
        if: steps.status.outputs.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_REPO }}
          status: success
          title: "✅ Validation réussie - ${{ inputs.service_name }}"
          description: "sha-${{ github.sha }}"

      - name: Notify Discord - échec
        if: steps.status.outputs.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_REPO }}
          status: failure
          title: "❌ Validation échouée - ${{ inputs.service_name }}"
          description: "@${{ github.actor }} - voir les logs"
          color: 0xFF0000

      - name: Bloquer si un job requis a échoué
        if: steps.status.outputs.result != 'success'
        run: exit 1
